download=true
http_user_agent=National Basemap (https://github.com/govlt/national-basemap)
http_retries=5
# A single connection to the CDN caps out around 18 MB/s, so downloading the ~3.5 GB of
# sources serially costs over 3 minutes. Sources are fetched in 100 MB chunks (see
# download_chunk_size_mb), so 4 connections saturate the runner's link instead.
download_threads=4
keep_unzipped=true
output_layerstats=true
bounds=19.01,53.88,26.83,56.46
nodemap_storage=ram
# Let every process thread write and re-read its own temp feature files instead of funnelling
# them through a single writer thread. On a 4 vCPU runner the single writer leaves ~3.5 minutes
# of the grpk stage running on one core after all processing is done.
parallel_tmp_io=true
tile_warning_size_mb=0.1
color=true
archive_description=National Vector Basemap of Lithuania (https://github.com/govlt/national-basemap)
archive_version=0.0.1
archive_attribution=<a href="https://www.geoportal.lt/geoportal/web/georeferencinio-pagrindo-kadastras-grpk" target="_blank">&copy; Geoportal.lt</a> <a href="https://www.registrucentras.lt/p/1187" target="_blank">&copy; Registrų centras</a> <a href="https://stvk.lt/" target="_blank">&copy; Saugomų teritorijų valstybės kadastras</a> <a href="https://openmaptiles.org/schema/" target="_blank">&copy; OpenMapTiles</a>
archive_type=baselayer
debug_url=http://localhost:8080/styles/bright/#{z}/{lat}/{lon}
# At max zoom level emit all features
min_feature_size_at_max_zoom=0
